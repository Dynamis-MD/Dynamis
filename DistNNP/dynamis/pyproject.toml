[build-system]
requires = ["scikit-build-core>=0.5"]
build-backend = "scikit_build_core.build"

[project]
name = "dynamis"
version = "0.0.1"
description = "A Python package for distributed neural network potentials (NNPs) in molecular dynamics simulations, providing tools for model management, state handling, and integration with MD engines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["torch>=2.0.0"]

[project.optional-dependencies]
test = ["pytest", "scipy"]

[tool.scikit-build]
build-dir = "skbuild"


[tool.scikit-build.wheel]
packages = ["src/dynamis"]
expand-macos-universal-tags = true
install-dir = "dynamis"

[tool.scikit-build.sdist]
include = ["src/dynamis/*.pyi", "src/dynamis/py.typed"]
