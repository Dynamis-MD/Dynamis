[build-system]
requires = ["scikit-build-core>=0.5", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "distnnp_state"
version = "0.1.0"
description = "C++ extension for distnnp state management"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[tool.scikit-build]
cmake.build-type = "Release"


[tool.scikit-build.wheel]
packages = ["src/distnnp_state"]
install-dir = "distnnp_state"

[tool.scikit-build.sdist]
include = ["src/distnnp_state/*.pyi", "src/distnnp_state/py.typed"]