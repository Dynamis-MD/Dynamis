[build-system]
requires = ["scikit-build-core>=0.5"]
build-backend = "scikit_build_core.build"

[project]
name = "dynamis_integrator"
version = "0.0.1"
description = "C++ molecular dynamics integrator for Dynamis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.scikit-build]
build-dir = "build"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build.wheel]
packages = ["src/dynamis_integrator"]
expand-macos-universal-tags = true
install-dir = "dynamis_integrator"

[tool.scikit-build.sdist]
include = ["src/dynamis_integrator/*.pyi", "src/dynamis_integrator/py.typed"]